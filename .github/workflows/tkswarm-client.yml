name: Build TKSwarm Client

on:
  workflow_dispatch:
  push:
    tags:
      - "client-v*"
  pull_request:

concurrency:
  group: tkswarm-client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: win
          - os: macos-latest
            artifact: mac

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # 注意：secrets 未配置时 GitHub 会注入空字符串；
      # electron-builder 会把空的 CSC_LINK 当成证书路径 → “仓库目录 not a file”
      - name: Build (current OS)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          CSC_LINK_RAW: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD_RAW: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID_RAW: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD_RAW: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID_RAW: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -e
          if [ -n "${CSC_LINK_RAW:-}" ]; then
            export CSC_LINK="$CSC_LINK_RAW"
            export CSC_KEY_PASSWORD="${CSC_KEY_PASSWORD_RAW:-}"
            unset CSC_IDENTITY_AUTO_DISCOVERY
          fi
          if [ -n "${APPLE_ID_RAW:-}" ]; then
            export APPLE_ID="$APPLE_ID_RAW"
            export APPLE_APP_SPECIFIC_PASSWORD="${APPLE_APP_SPECIFIC_PASSWORD_RAW:-}"
            export APPLE_TEAM_ID="${APPLE_TEAM_ID_RAW:-}"
          fi
          npm run dist:ci

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tkswarm-client-${{ matrix.artifact }}-${{ github.sha }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/latest*.yml
            dist/*.blockmap
          if-no-files-found: warn
          retention-days: 14

  release:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/client-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Collect release files
        shell: bash
        run: |
          mkdir -p out
          find release-assets -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.zip' -o -name '*.AppImage' -o -name '*.yml' -o -name '*.blockmap' \) -print -exec cp {} out/ \;
          ls -la out

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
