appId: com.tkswarm.client
productName: Dyy TkSwarm Client
copyright: Copyright © TKSwarm
directories:
  output: dist
  buildResources: build

# 打包体积优化（功能不变）：
# - maximum：安装包/便携包用更强压缩（构建稍慢）
# - electronLanguages：只保留中英语言包，去掉 Chromium 其它几十种 locale（通常可省数 MB～十余 MB）
compression: maximum
electronLanguages:
  - en-US
  - zh-CN

files:
  - main.js
  - preload.js
  - index.html
  - styles.css
  - app.js
  - config.js
  - package.json
  - logo.png
  - lib/**/*
  # icon 只放 buildResources，勿打进 asar
  - "!**/*.md"
  - "!**/.git*"
  - "!**/node_modules/**"
asar: true
# 将 homepage / repository.owner 改成真实 GitHub 后，打 tag 可自动发 Release
publish:
  - provider: github
    releaseType: release

win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  artifactName: ${productName}-${version}-win-${arch}.${ext}
  # 可选签名：在 CI 配置 CSC_LINK / CSC_KEY_PASSWORD

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Dyy TkSwarm Client
  installerLanguages: [zh_CN, en_US]
  language: "2052"
  # 差分更新块图可略增构建产物体积；单文件下载场景可关掉
  differentialPackage: false

portable:
  artifactName: ${productName}-${version}-win-portable.${ext}

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  category: public.app-category.business
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # 可选签名/公证：在 GitHub Secrets 配置 CSC_LINK 等（勿留空字符串）

dmg:
  artifactName: ${productName}-${version}-mac-${arch}.${ext}

linux:
  target:
    - target: AppImage
      arch: [x64]
  category: Utility
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
